name: Website CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-website/**'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-website/**'

defaults:
  run:
    working-directory: ./flobrain-website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: flobrain-website/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build
