name: Backend CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-cloud/**'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-cloud/**'

defaults:
  run:
    working-directory: ./flobrain-cloud

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Formatting (Black)
      run: black --check .

    - name: Lint (Ruff)
      run: ruff check .

    - name: Typecheck (Mypy)
      run: mypy .

    - name: Test (Pytest)
      run: pytest
