name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      # 2. Configure Node.js    
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' 

      # 3. Install dependencies (equivalent to npm install)
      - name: Install dependencies
        run: npm ci

      # 4. Run tests with coverage (the command we created)
      - name: Run AI Mock Tests
        run: npm run test:ci