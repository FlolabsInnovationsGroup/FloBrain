name: Core Backend CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-core/backend/**'
      - '.github/workflows/core-backend-ci.yml'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - 'flobrain-core/backend/**'
      - '.github/workflows/core-backend-ci.yml'

defaults:
  run:
    working-directory: ./flobrain-core/backend

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis service required by Django Channels and Celery.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Offline by design: SQLite, Redis for Channels and Celery.
    # Other external services are isolated or mocked during tests.
    env:
      DB_ENGINE: sqlite
      DEBUG: "False"
      SECRET_KEY: ci-only-not-a-secret-core-backend-key-0123456789abcdef
      MONGO_HOST: 10.255.255.1
      MULTIMODAL_SERVICE_URL: http://10.255.255.1:9
      MEMORY_AUTO_CAPTURE: "False"
      MEMORY_TOKENIZER: estimate
      ANONYMIZED_TELEMETRY: "False"
      REDIS_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: flobrain-core/backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system check
      run: python manage.py check

    - name: Migrations are up to date
      run: python manage.py makemigrations --check --dry-run

    - name: Test (all apps)
      run: python manage.py test --noinput