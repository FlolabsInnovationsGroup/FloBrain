[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/facebookresearch/faiss/archive/main.zip
  #espressif/esp-dl@^2.1.0
build_flags =
  -DCONFIG_CAMERA_TASK_STACK_SIZE=4096
  -DFAISS_EMBEDDED
board_build.partitions = custom.csv