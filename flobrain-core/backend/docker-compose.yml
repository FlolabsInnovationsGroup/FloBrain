services:
  db:
    image: postgres:15
    container_name: flobrain_backend_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=flobrain_db
      - POSTGRES_USER=flo_user
      - POSTGRES_PASSWORD=flo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flo_user -d flobrain_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:latest
    container_name: flobrain_backend_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flobrain_backend_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: flobrain_backend_django
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=flobrain_db
      - DB_USER=flo_user
      - DB_PASS=flo_password
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
